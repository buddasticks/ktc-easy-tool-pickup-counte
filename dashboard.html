<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tool Pickup Counter</title>
<style>
:root{color-scheme:dark;--bg:#181a1f;--panel:#23262d;--border:#383d47;--text:#e6e8ec;--muted:#9ba3b1;--blue:#65a9ff;--green:#65cf91;--red:#ff7777}
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;min-height:100%;background:var(--bg);color:var(--text);font:13px/1.3 system-ui,-apple-system,sans-serif}body{overflow-x:hidden}main{width:100%;padding:8px}header{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:7px}h1{margin:0;font-size:clamp(14px,4vw,19px);font-weight:700;letter-spacing:-.3px}.status{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:10px;white-space:nowrap}.dot{width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:var(--red)}.status.online{color:var(--green)}.status.online .dot{background:var(--green)}
.total{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 11px;margin-bottom:7px;background:var(--panel);border:1px solid var(--border);border-radius:8px}.total-label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px}.total-number{color:var(--blue);font-size:clamp(25px,7vw,36px);font-weight:750;line-height:1;font-variant-numeric:tabular-nums}.total-right{text-align:right}.total-caption{color:var(--muted);font-size:10px;margin-top:3px}
.print-total{border-color:#426b9b}.print-total .total-number{color:var(--green)}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.tool{min-width:0;padding:9px 10px;background:var(--panel);border:1px solid var(--border);border-radius:8px}.tool-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.tool-name{font-size:15px;font-weight:750}.tool-badge{color:var(--muted);font-size:9px;border:1px solid var(--border);border-radius:4px;padding:2px 4px}.metric{display:flex;align-items:center;justify-content:space-between;gap:5px;min-height:23px}.metric+.metric{border-top:1px solid #343842;padding-top:4px;margin-top:3px}.metric-label{color:var(--muted);font-size:11px}.metric-value{font-size:clamp(17px,4.5vw,22px);line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}.pickups{color:var(--green)}.failures{color:var(--muted)}.failures.has-failures{color:var(--red)}
footer{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:7px;color:var(--muted);font-size:10px}#message{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}button{flex:0 0 auto;padding:4px 7px;border:1px solid var(--border);border-radius:5px;background:var(--panel);color:var(--text);font:inherit;cursor:pointer}button:active{background:#343842}@media(min-width:600px){main{padding:10px}.tool{padding:10px 12px}}
</style>
</head>
<body>
<main>
<header><h1>Tool Pickups</h1><div id="status" class="status"><span class="dot"></span><span id="statusText">Connecting</span></div></header>
<section class="total"><div><div class="total-label">Total tool changes</div><div class="total-caption">All tools · Lifetime count</div></div><div class="total-right"><div id="total" class="total-number">—</div></div></section>
<section class="total print-total"><div><div class="total-label">This print</div><div class="total-caption">All tools · Current / most recent print</div></div><div class="total-right"><div id="printTotal" class="total-number">—</div></div></section>
<section class="tools">
<article class="tool"><div class="tool-head"><span class="tool-name">T0</span><span class="tool-badge">Reference</span></div><div class="metric"><span class="metric-label">Pickups</span><span id="t0-pickups" class="metric-value pickups">—</span></div><div class="metric"><span class="metric-label">Failures</span><span id="t0-failures" class="metric-value failures">—</span></div></article>
<article class="tool"><div class="tool-head"><span class="tool-name">T1</span></div><div class="metric"><span class="metric-label">Pickups</span><span id="t1-pickups" class="metric-value pickups">—</span></div><div class="metric"><span class="metric-label">Failures</span><span id="t1-failures" class="metric-value failures">—</span></div></article>
<article class="tool"><div class="tool-head"><span class="tool-name">T2</span></div><div class="metric"><span class="metric-label">Pickups</span><span id="t2-pickups" class="metric-value pickups">—</span></div><div class="metric"><span class="metric-label">Failures</span><span id="t2-failures" class="metric-value failures">—</span></div></article>
<article class="tool"><div class="tool-head"><span class="tool-name">T3</span></div><div class="metric"><span class="metric-label">Pickups</span><span id="t3-pickups" class="metric-value pickups">—</span></div><div class="metric"><span class="metric-label">Failures</span><span id="t3-failures" class="metric-value failures">—</span></div></article>
</section>
<footer><span id="message">Waiting for counter data…</span><button id="refresh" type="button">Refresh</button></footer>
</main>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id);let socket,requestId=1,pending=new Map(),reconnectTimer,refreshTimer,retryDelay=1000,lastData=false;
function setConnection(online,text){$('status').classList.toggle('online',online);$('statusText').textContent=text}
function rpc(method,params={}){return new Promise((resolve,reject)=>{if(!socket||socket.readyState!==WebSocket.OPEN){reject(new Error('Not connected'));return}const id=requestId++;const timeout=setTimeout(()=>{pending.delete(id);reject(new Error('Request timed out'))},7000);pending.set(id,{resolve,reject,timeout});try{socket.send(JSON.stringify({jsonrpc:'2.0',method,params,id}))}catch(error){clearTimeout(timeout);pending.delete(id);reject(error)}})}
function count(id,value){const element=$(id),number=Number(value),valid=value!==null&&value!==undefined&&value!==''&&Number.isFinite(number)&&number>=0;element.textContent=valid?number.toLocaleString():'0';if(id.endsWith('-failures'))element.classList.toggle('has-failures',valid&&number>0)}
function render(variables){if(!variables||typeof variables!=='object')throw new Error('Saved variables are unavailable');for(const [key,id] of [['total_toolchanges','total'],['print_toolchanges','printTotal']]){const number=Number(variables[key]);$(id).textContent=Number.isFinite(number)&&number>=0?number.toLocaleString():'0'}const keys=['total_toolchanges','print_toolchanges'];for(let t=0;t<4;t++){keys.push(`tool_t${t}_pickups`,`tool_t${t}_failures`);count(`t${t}-pickups`,variables[`tool_t${t}_pickups`]);count(`t${t}-failures`,variables[`tool_t${t}_failures`])}const missing=keys.filter(key=>!(key in variables));lastData=true;$('message').textContent=missing.length?'Some counters not saved yet · Missing values shown as 0':`Live · Updated ${new Date().toLocaleTimeString()}`}
async function refresh(){try{const result=await rpc('printer.objects.query',{objects:{save_variables:['variables']}});const variables=result&&result.status&&result.status.save_variables&&result.status.save_variables.variables;render(variables)}catch(error){$('message').textContent=lastData?'Refresh failed · Showing last values':'Waiting for saved counter variables'}}
function connect(){clearTimeout(reconnectTimer);setConnection(false,'Connecting');const scheme=location.protocol==='https:'?'wss:':'ws:';socket=new WebSocket(`${scheme}//${location.host}/websocket`);socket.addEventListener('open',async()=>{retryDelay=1000;setConnection(true,'Connected');await refresh();clearInterval(refreshTimer);refreshTimer=setInterval(refresh,5000)});socket.addEventListener('message',event=>{let data;try{data=JSON.parse(event.data)}catch(_){return}if(data.id===undefined||!pending.has(data.id))return;const request=pending.get(data.id);pending.delete(data.id);clearTimeout(request.timeout);if(data.error)request.reject(new Error(data.error.message||'Moonraker error'));else request.resolve(data.result)});socket.addEventListener('error',()=>setConnection(false,'Connection error'));socket.addEventListener('close',()=>{clearInterval(refreshTimer);for(const request of pending.values()){clearTimeout(request.timeout);request.reject(new Error('Disconnected'))}pending.clear();setConnection(false,'Offline');$('message').textContent=lastData?'Offline · Last values retained':'Reconnecting to Moonraker…';reconnectTimer=setTimeout(connect,retryDelay);retryDelay=Math.min(retryDelay*2,15000)})}
$('refresh').addEventListener('click',refresh);connect();
})();
</script>
</body>
</html>
